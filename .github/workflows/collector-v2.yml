name: collector-v2 (manual, artifact only)
# Manual trigger only: no schedule, no push to sub/live, no Cloudflare, no secrets.
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: collector-v2
  cancel-in-progress: true
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Tests
        run: |
          python -m unittest discover -s tests
          python -m unittest discover -s collector_v2/tests -t .
      - name: Collect (allowlisted public sources only)
        env:
          OUT_DIR: collector_v2_out
        run: python collector_v2/collect.py
      - uses: actions/upload-artifact@v4
        with:
          name: collector-v2-output
          path: collector_v2_out/
          retention-days: 7
