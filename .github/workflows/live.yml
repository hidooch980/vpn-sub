name: Live meta

# Small files apps poll for changes (version.json + flags/notice/latest), on the `live` branch.
# Short job every 5 min (GitHub often runs it later); reads the Worker once per run.
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch: {}
  push:
    branches: [main]
    paths: [live_meta.py, .github/workflows/live.yml]

permissions:
  contents: write
  actions: write # lets a run start the next one (GitHub's */5 cron is often delayed or never fires)

concurrency:
  group: live-meta
  cancel-in-progress: false

jobs:
  live:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
      LIVE_TOPIC: molidovpn-live-971a1da8ec4af75c
    steps:
      - uses: actions/checkout@v5
      - run: python3 -m unittest tests/test_live_meta.py
      - id: meta
        run: python3 live_meta.py out
      - name: Publish to 'live' (no history)
        if: steps.meta.outputs.changed == 'true'
        run: |
          cd out
          git init -q -b live
          git config user.name "vpn-bot"
          git config user.email "vpn-bot@users.noreply.github.com"
          git add -A
          git commit -q -m "live ${{ steps.meta.outputs.version }}"
          git push -q --force "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" live:live
      - name: Purge jsDelivr and wake open apps
        if: steps.meta.outputs.changed == 'true'
        continue-on-error: true
        run: |
          # jsDelivr resolves @live to a commit with its own short cache: purge now and again after it settles.
          for round in 1 2; do
            for f in version.json flags.json notice.json latest.json; do
              curl -fsS -m 20 "https://purge.jsdelivr.net/gh/${GITHUB_REPOSITORY}@live/$f" -o /dev/null || true
            done
            [ "$round" = 1 ] && sleep 45
          done
          # Hint only (the app re-reads version.json from GitHub); a forged hint costs one small GET.
          curl -fsS -m 20 -d '{"t":"v","v":"${{ steps.meta.outputs.version }}"}' "https://ntfy.sh/$LIVE_TOPIC" -o /dev/null || true

  # Self-scheduling loop so a new release reaches apps within ~4 min without any Worker polling.
  # The cron above stays as a backup if the chain breaks.
  schedule-next:
    needs: live
    if: always() && github.ref == 'refs/heads/main' && github.event_name != 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Start the next live check in ~3 minutes
        run: |
          sleep 180
          # One chain only: if another live run is already queued or running, let it carry on.
          others=$(gh run list -R "$GITHUB_REPOSITORY" -w live.yml -L 20 --json databaseId,status \
            --jq "[.[] | select(.databaseId != ${{ github.run_id }} and (.status == \"queued\" or .status == \"in_progress\" or .status == \"pending\" or .status == \"waiting\"))] | length")
          if [ "${others:-0}" -gt 0 ]; then echo "another live run is active; not chaining"; exit 0; fi
          gh workflow run live.yml -R "$GITHUB_REPOSITORY" --ref main
