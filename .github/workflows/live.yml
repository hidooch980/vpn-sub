name: Live meta

# Small files apps poll for changes (version.json + flags/notice/latest), on the `live` branch.
# Short job every 5 min (GitHub often runs it later); reads the Worker once per run.
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch: {}
  push:
    branches: [main]
    paths: [live_meta.py, .github/workflows/live.yml]

permissions:
  contents: write

concurrency:
  group: live-meta
  cancel-in-progress: false

jobs:
  live:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
      LIVE_TOPIC: molidovpn-live-971a1da8ec4af75c
    steps:
      - uses: actions/checkout@v5
      - run: python3 -m unittest tests/test_live_meta.py
      - id: meta
        run: python3 live_meta.py out
      - name: Publish to 'live' (no history)
        if: steps.meta.outputs.changed == 'true'
        run: |
          cd out
          git init -q -b live
          git config user.name "vpn-bot"
          git config user.email "vpn-bot@users.noreply.github.com"
          git add -A
          git commit -q -m "live ${{ steps.meta.outputs.version }}"
          git push -q --force "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" live:live
      - name: Purge jsDelivr and wake open apps
        if: steps.meta.outputs.changed == 'true'
        continue-on-error: true
        run: |
          for f in version.json flags.json notice.json latest.json; do
            curl -fsS -m 20 "https://purge.jsdelivr.net/gh/${GITHUB_REPOSITORY}@live/$f" -o /dev/null || true
          done
          # Hint only (the app re-reads version.json from GitHub); a forged hint costs one small GET.
          curl -fsS -m 20 -d '{"t":"v","v":"${{ steps.meta.outputs.version }}"}' "https://ntfy.sh/$LIVE_TOPIC" -o /dev/null || true
